name: Auto Merge Bug/Hotfix Branch
##############################################################################################################
# The workflow will execute the jobs to back merge changes to develop pushed to release/HotFix/BugFix branches
##############################################################################################################
on:
  workflow_dispatch:
    inputs:
      pull_request_head:
        description: 'Source branch of the PR like hotfix/04'
        default: 'github.event.pull_request.head.ref'
        required: true
        type: string
      pull_request_base:
        description: 'Base branch of the PR like release/03'
        default: 'github.event.pull_request.base.ref'
        required: true
        type: string
      pull_request_user:
        description: 'PR author'
        required: true
        type: string


  pull_request:
   types: [closed]
   branches:
     - 'release/*'
     - 'hotfix/*'

permissions:
  contents: write
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      should_merge: ${{ steps.set-up.outputs.should_merge }}
    steps:
    - name: Set up environment
      id: set-up
      run: |
        BASE_BRANCH="${{ github.event.pull_request.base.ref }}"
        HEAD_BRANCH="${{ github.event.pull_request.head.ref }}"
        if [[ "$BASE_BRANCH" =~ ^release/.*$ ]] && [[ "$HEAD_BRANCH" =~ ^hotfix/.*$ ]]; then
          echo "should_merge=true" >> $GITHUB_OUTPUT
        else
          echo "should_merge=false" >> $GITHUB_OUTPUT
        fi

  merge-to-develop:
    needs: setup
    if: needs.setup.outputs.should_merge == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Generate GitHub App token
      id: generate_token
      uses: tibdex/github-app-token@v1
      with:
        app_id: ${{ secrets.GH_APP_ID }}
        # installation_id: ${{ secrets.GH_APP_INSTALLATION_ID }}
        private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}

    - name: Use the Token
      run: |
        echo "Token generated successfully: ${{ steps.generate_token.outputs.token }}"

    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        ref: develop
        token: ${{ steps.generate_token.outputs.token }}

    - name: Set git name and email
      run: |
        git config user.name "CI/CD Merge Forward"
        git config user.email "ci-cd@gmail.com"

    - name: Fetch Develop and Head branches
      run: |
        git fetch origin develop
        git fetch origin ${{ github.event.pull_request.head.ref }}

    - name: Merge into develop
      id: merge
      continue-on-error: true
      run: |
        current_branch="${{ github.event.pull_request.head.ref }}"
        target_branch="develop"

        echo "Merging ${current_branch} -> ${target_branch}"
        git checkout $target_branch

        # if git merge --no-ff --no-edit --allow-unrelated-histories origin/$current_branch; then

        # Attempt merge with conflict resolution strategy
        if git merge --no-ff --no-edit --allow-unrelated-histories --strategy-option theirs origin/$current_branch; then
          echo "merge_status=success" >> $GITHUB_OUTPUT
        else
          echo "merge_status=failed" >> $GITHUB_OUTPUT
          git merge --abort
          exit 1
        fi

    - name: Push changes
      if: steps.merge.outputs.merge_status == 'success'
      run: |
        git push origin develop
      env:
        GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}